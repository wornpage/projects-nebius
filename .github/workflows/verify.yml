name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix svelte-frontend ci --ignore-scripts --no-audit --no-fund
      - name: Resolve hosted Chrome
        shell: bash
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$chrome"
          echo "CHROME_EXECUTABLE_PATH=$chrome" >> "$GITHUB_ENV"
      - run: npm run verify
      - run: npm run test:browser

  verify-nebius:
    name: Nebius provider-free verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix svelte-frontend ci --ignore-scripts --no-audit --no-fund
      - name: Resolve hosted Chrome
        shell: bash
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$chrome"
          echo "CHROME_EXECUTABLE_PATH=$chrome" >> "$GITHUB_ENV"
      # Authored/synthetic fixtures, local build, Worker dry run and disabled runtime.
      # These gates supply no provider credentials and do not establish model quality.
      - name: Verify the Nebius edition
        run: npm run verify:nebius
      - name: Check the authored tool through the production preview
        run: npm run test:nebius:tool-preview
      - name: Check project approval and persistence
        run: npm run test:nebius:projects
      - name: Check task approval and keyboard access
        run: npm run test:nebius:browser
      - name: Check offline save and reload
        run: npm run test:nebius:offline
      - name: Check backup selection and replacement
        run: npm run test:nebius:portability
