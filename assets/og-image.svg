<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Wornpage Projects — Turn a task into a tool</title>
  <desc id="desc">An illustrated project workspace showing a brief, a tool built with Nemotron on Nebius, and a human review.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111617"/>
      <stop offset="1" stop-color="#22292a"/>
    </linearGradient>
    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#252c2d"/>
      <stop offset="1" stop-color="#1b2122"/>
    </linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#396e60" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#396e60" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="155%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <path d="M0 524H1200" stroke="#34403e" stroke-opacity="0.45"/>
  <path d="M0 526H1200" stroke="#0c1112" stroke-opacity="0.4"/>

  <g transform="translate(68 58)" font-family="Segoe UI, Arial, sans-serif">
    <rect width="48" height="48" rx="12" fill="#e6efeb"/>
    <text x="24" y="33" text-anchor="middle" font-size="27" font-weight="700" fill="#18211f">W</text>
    <text x="64" y="20" font-size="20" font-weight="700" fill="#f4f7f5">Wornpage Projects</text>
    <text x="64" y="41" font-size="12" font-weight="700" letter-spacing="1.5" fill="#a7b5af">NEBIUS EDITION</text>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="68" y="175" font-size="13" font-weight="700" letter-spacing="2" fill="#91cdb9">FROM WORK TO A TOOL</text>
    <text x="68" y="251" font-size="64" font-weight="700" letter-spacing="-1.6" fill="#f6f8f7">Turn a task</text>
    <text x="68" y="324" font-size="64" font-weight="700" letter-spacing="-1.6" fill="#f6f8f7">into a tool.</text>
    <text x="70" y="381" font-size="21" fill="#cbd5d0">Build with Nemotron on Nebius.</text>
    <text x="70" y="414" font-size="21" fill="#cbd5d0">Review the evidence. You decide.</text>
    <path d="M70 465H116" stroke="#87c8b3" stroke-width="3" stroke-linecap="round"/>
    <text x="130" y="471" font-size="13" font-weight="700" letter-spacing="1.2" fill="#aebcb6">BRIEF  /  TOOL  /  REVIEW</text>
  </g>

  <g transform="translate(644 91)" filter="url(#shadow)" font-family="Segoe UI, Arial, sans-serif">
    <rect width="488" height="454" rx="20" fill="url(#surface)" stroke="#596863" stroke-width="1.5"/>
    <text x="28" y="39" font-size="12" font-weight="700" letter-spacing="1.4" fill="#aebcb6">PROJECT WORKSPACE</text>
    <text x="460" y="39" text-anchor="end" font-size="12" font-weight="700" fill="#9ed9c4">TASK</text>
    <path d="M28 58H460" stroke="#495652"/>

    <text x="28" y="99" font-size="25" font-weight="700" fill="#f4f7f5">Release packet checker</text>
    <text x="28" y="126" font-size="15" fill="#b7c4be">A small tool for the work at hand</text>

    <g transform="translate(28 157)">
      <path d="M16 16V180" stroke="#536b61" stroke-width="2"/>
      <circle cx="16" cy="16" r="16" fill="#e4efea"/>
      <text x="16" y="21" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2923">1</text>
      <text x="46" y="13" font-size="17" font-weight="700" fill="#f4f7f5">Brief</text>
      <text x="46" y="35" font-size="14" fill="#bdc9c3">Define what the tool should do.</text>

      <circle cx="16" cy="97" r="16" fill="#e4efea"/>
      <text x="16" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2923">2</text>
      <text x="46" y="94" font-size="17" font-weight="700" fill="#f4f7f5">Tool</text>
      <text x="46" y="116" font-size="14" fill="#bdc9c3">Generate code and checks on Nebius.</text>

      <circle cx="16" cy="178" r="16" fill="#e4efea"/>
      <text x="16" y="183" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2923">3</text>
      <text x="46" y="175" font-size="17" font-weight="700" fill="#f4f7f5">Review</text>
      <text x="46" y="197" font-size="14" fill="#bdc9c3">Inspect the source and evidence.</text>
    </g>

    <path d="M28 382H460" stroke="#495652"/>
    <text x="28" y="414" font-size="14" font-weight="700" fill="#a3d7c5">Your decision</text>
    <text x="28" y="435" font-size="13" fill="#cbd5d0">Choose what to keep with your project.</text>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#aebcb6">
    <text x="68" y="587">NVIDIA NEMOTRON  +  NEBIUS</text>
    <text x="1132" y="587" text-anchor="end">WORK  ·  BUILD  ·  REVIEW</text>
  </g>
</svg>
